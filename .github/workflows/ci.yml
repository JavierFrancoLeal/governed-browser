name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit & cryptographic chain tests
        run: npm test
      - name: Smoke test CLI commit-click brake
        run: |
          node src/cli.mjs check --selector "#preview" --label "Preview invoice"
          set +e
          node src/cli.mjs check --selector "#pay" --label "Payer $1,450.00" --submit
          rc=$?
          set -e
          test "$rc" -eq 2
